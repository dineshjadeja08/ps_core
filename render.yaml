services:
  - type: web
    name: purple-squad-backend
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -'
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OTP_AUTH_PROVIDER
        value: apps.accounts.otp.providers.Msg91OtpProvider
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ADAPTER
        value: apps.payments.providers.RazorpayApiAdapter
      - key: USE_CLOUDINARY_MEDIA
        value: "true"
      - key: CLOUDINARY_URL
        sync: false
      - key: NOTIFICATION_PROVIDER
        value: apps.notifications.providers.LocalNotificationProvider
      - key: DEV_PHONE_LOGIN_ENABLED
        value: "false"
      - key: SHOW_API_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
