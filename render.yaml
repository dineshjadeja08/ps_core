services:
  - type: keyvalue
    name: purple-squad-cache
    plan: free
    ipAllowList: []

  - type: web
    name: purple-squad-backend
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/scripts/render-start.sh
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: purple-squad-cache
          property: connectionString
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OTP_AUTH_PROVIDER
        value: apps.accounts.otp.providers.Msg91OtpProvider
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_WHATSAPP_INTEGRATED_NUMBER
        sync: false
      - key: MSG91_WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: MSG91_WHATSAPP_TEMPLATE_NAMESPACE
        sync: false
      - key: MSG91_WHATSAPP_NOTIFICATION_TEMPLATE_NAME
        sync: false
      - key: MSG91_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ADAPTER
        value: apps.payments.providers.RazorpayApiAdapter
      - key: USE_CLOUDINARY_MEDIA
        value: "true"
      - key: CLOUDINARY_URL
        sync: false
      - key: NOTIFICATION_PROVIDER
        value: apps.notifications.providers.Msg91WhatsAppNotificationProvider
      - key: DEV_PHONE_LOGIN_ENABLED
        value: "false"
      - key: SHOW_API_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DRF_NUM_PROXIES
        value: "1"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_REGION
        value: auto

  - type: cron
    name: purple-squad-database-backup
    runtime: docker
    plan: 0.5c-512mb
    branch: main
    schedule: "30 18 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: python manage.py backup_database
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.backup
      - key: DATABASE_URL
        sync: false
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_REGION
        value: auto
      - key: BACKUP_RETENTION_DAYS
        value: "30"
