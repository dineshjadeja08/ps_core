services:
  - type: web
    name: purple-squad-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py check --deploy
    disk:
      name: purple-squad-media
      mountPath: /app/media
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: purple-squad-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OTP_AUTH_PROVIDER
        value: apps.accounts.otp.providers.Msg91OtpProvider
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ADAPTER
        value: apps.payments.providers.RazorpayApiAdapter
      - key: NOTIFICATION_PROVIDER
        value: apps.notifications.providers.LocalNotificationProvider
      - key: DEV_PHONE_LOGIN_ENABLED
        value: "false"
      - key: SHOW_API_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: purple-squad-postgres
    plan: starter
    databaseName: purple_squad
    user: purple_squad
