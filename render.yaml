services:
  - type: keyvalue
    name: purple-squad-cache
    plan: free
    ipAllowList: []

  - type: web
    name: purple-squad-backend
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/scripts/render-start.sh
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: purple-squad-cache
          property: connectionString
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: BUSINESS_LEGAL_NAME
        sync: false
      - key: BUSINESS_GSTIN
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_ADAPTER
        value: apps.payments.providers.RazorpayApiAdapter
      - key: USE_CLOUDINARY_MEDIA
        value: "true"
      - key: CLOUDINARY_URL
        sync: false
      - key: NOTIFICATION_PROVIDER
        value: apps.notifications.fcm.FirebaseCloudMessagingProvider
      - key: DEV_PHONE_LOGIN_ENABLED
        value: "false"
      - key: SHOW_API_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DRF_NUM_PROXIES
        value: "1"
