services:
  worker:
    build: .
    command: celery -A config worker --beat --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql://purple_squad:purple_squad@db:5432/purple_squad
      REDIS_URL: redis://cache:6379/0
      CELERY_BROKER_URL: redis://cache:6379/1
      CELERY_RESULT_BACKEND: redis://cache:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy

  cache:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: purple_squad
      POSTGRES_USER: purple_squad
      POSTGRES_PASSWORD: purple_squad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purple_squad -d purple_squad"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
