services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: purple_squad
      POSTGRES_USER: purple_squad
      POSTGRES_PASSWORD: purple_squad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purple_squad -d purple_squad"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
