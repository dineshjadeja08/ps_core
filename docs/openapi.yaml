      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminServiceCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminServiceCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminServiceCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminServiceCategory'
          description: ''
    delete:
      operationId: api_v1_admin_service_categories_destroy
      parameters:
