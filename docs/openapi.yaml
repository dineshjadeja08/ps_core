    TechnicianProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        employee_code:
          type: string
          maxLength: 40
        display_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 16
        skills:
          type: array
          items:
            $ref: '#/components/schemas/TechnicianSkill'
          readOnly: true
        service_areas:
          type: object
          additionalProperties: {}
          readOnly: true
        is_available:
          type: boolean
        is_active:
          type: boolean
        joined_at:
          type: string
          format: date
          nullable: true
      required:
      - display_name
      - employee_code
      - id
      - phone
      - service_areas
      - skills
    TechnicianSkill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
      required:
      - id
      - name
    TimeSlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        service_area:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        available_capacity:
          type: integer
          readOnly: true
      required:
      - available_capacity
      - capacity
      - date
      - end_time
      - id
      - service_area
      - start_time
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        token_type:
          type: string
      required:
      - access
      - refresh
      - token_type
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        customer_profile:
          allOf:
          - $ref: '#/components/schemas/CustomerProfile'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer_profile
      - email
      - first_name
      - id
      - is_verified
      - last_name
      - phone_number
      - role
      - updated_at
    WebhookResponse:
      type: object
      properties:
        processed:
          type: boolean
        event:
          type: string
      required:
      - processed
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
