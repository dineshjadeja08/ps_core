  /api/v1/admin/technicians/:
    get:
      operationId: api_v1_admin_technicians_list
      description: Returns active technician profiles for booking assignment.
      summary: List active technicians for admin
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnicianProfile'
          description: ''
  /api/v1/auth/dev-phone/:
    post:
      operationId: api_v1_auth_dev_phone_create
      description: Debug-only temporary login for local development while Firebase
        Phone Auth is unavailable.
      summary: Development phone login
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevPhoneLoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevPhoneLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevPhoneLoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
          description: ''
  /api/v1/auth/firebase/:
    post:
      operationId: api_v1_auth_firebase_create
      description: Verifies a Firebase ID token server-side, extracts the verified
        phone number, creates or retrieves the Purple Squad user, and returns backend
        JWT credentials.
      summary: Authenticate with Firebase phone token
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirebaseLoginRequestRequest'
            examples:
              LoginRequest:
                value:
                  id_token: firebase-id-token
                summary: Login request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FirebaseLoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FirebaseLoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
              examples:
                LoginResponse:
                  value:
                    user:
                      id: 67d9bd9d-31af-4c75-b443-04377885242e
                      phone_number: '+919876543210'
                      email: null
                      first_name: ''
                      last_name: ''
                      role: CUSTOMER
                      is_verified: true
                      customer_profile:
                        id: 406f0389-df33-4a09-aed7-1fcb66f85321
                        display_name: ''
                        alternate_phone: ''
                      created_at: '2026-08-18T12:00:00+05:30'
                      updated_at: '2026-08-18T12:00:00+05:30'
                    tokens:
                      access: jwt-access-token
                      refresh: jwt-refresh-token
                      token_type: Bearer
                    created: true
                  summary: Login response
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: Blacklists the supplied refresh token. The access token naturally
        expires.
      summary: Logout
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
              required:
              - refresh
            examples:
              LogoutRequest:
                value:
                  refresh: jwt-refresh-token
                summary: Logout request
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      description: Returns the authenticated Purple Squad user profile.
      summary: Get current user
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: api_v1_auth_me_partial_update
      description: Updates editable customer profile fields for the authenticated
        user.
      summary: Update current user profile
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
