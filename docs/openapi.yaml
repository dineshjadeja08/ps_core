openapi: 3.0.3
info:
  title: Purple Squad API
  version: v1
  description: API for the Purple Squad home services platform.
paths:
  /api/v1/addresses/:
    get:
      operationId: api_v1_addresses_list
      description: Returns active saved addresses belonging to the authenticated customer.
      summary: List customer addresses
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: api_v1_addresses_create
      description: Creates a saved address for the authenticated customer. Core persistence
        does not call Google Maps.
      summary: Create customer address
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/addresses/{id}/:
    get:
      operationId: api_v1_addresses_retrieve
      description: Returns one active address owned by the authenticated customer.
      summary: Get customer address
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: api_v1_addresses_partial_update
      description: Partially updates one active address owned by the authenticated
        customer.
      summary: Update customer address
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: api_v1_addresses_destroy
      description: Soft-deletes an address by marking it inactive.
      summary: Deactivate customer address
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/bookings/:
    get:
      operationId: api_v1_admin_bookings_list
      description: Returns all customer bookings for admin operations with optional
        status and booking number search.
      summary: List all bookings for admin
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
  /api/v1/admin/bookings/{booking_id}/assign-technician/:
    post:
      operationId: api_v1_admin_bookings_assign_technician_create
      description: Admin-only manual technician assignment. Records assignment history,
        supports reassignment, updates booking.assigned_technician, and moves booking
        status to TECHNICIAN_ASSIGNED.
      summary: Assign technician to booking
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTechnicianRequestRequest'
            examples:
              AssignTechnicianRequest:
                value:
                  technician_id: 67d9bd9d-31af-4c75-b443-04377885242e
                  notes: Manual dispatch.
                summary: Assign technician request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignTechnicianRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignTechnicianRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/admin/bookings/{booking_id}/cancel/:
    post:
      operationId: api_v1_admin_bookings_cancel_create
      summary: Run admin booking operation
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/admin/bookings/{booking_id}/complete/:
    post:
      operationId: api_v1_admin_bookings_complete_create
      summary: Run admin booking operation
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/admin/bookings/{booking_id}/record-balance/:
    post:
      operationId: api_v1_admin_bookings_record_balance_create
      summary: Record offline booking balance
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceCollectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BalanceCollectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BalanceCollectionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/admin/bookings/{booking_id}/start/:
    post:
      operationId: api_v1_admin_bookings_start_create
      summary: Run admin booking operation
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingOperationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/admin/bookings/{id}/:
    get:
      operationId: api_v1_admin_bookings_retrieve
      description: Returns one booking by id for admin operations.
      summary: Get any booking for admin
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
