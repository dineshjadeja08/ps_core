  /api/v1/admin/bookings/{booking_id}/assign-technician/:
    post:
      operationId: api_v1_admin_bookings_assign_technician_create
      description: Admin-only manual technician assignment. Records assignment history,
        supports reassignment, updates booking.assigned_technician, and moves booking
        status to TECHNICIAN_ASSIGNED.
      summary: Assign technician to booking
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTechnicianRequestRequest'
            examples:
              AssignTechnicianRequest:
                value:
                  technician_id: 67d9bd9d-31af-4c75-b443-04377885242e
                  notes: Manual dispatch.
                summary: Assign technician request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignTechnicianRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignTechnicianRequestRequest'
        required: true
      security:
