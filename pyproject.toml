[project]
name = "purple-squad-backend"
version = "0.1.0"
description = "Purple Squad home services backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17.2,<3.18",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "drf-spectacular>=0.27,<0.28",
    "django-environ>=0.11,<0.12",
    "dj-database-url>=2.3,<3",
    "django-cors-headers>=4.4,<4.5",
    "whitenoise>=6.7,<6.8",
    "django-cloudinary-storage>=0.3,<0.4",
    "psycopg[binary]>=3.2,<3.3",
    "gunicorn>=22,<23",
    "razorpay>=2.0,<3",
    "Pillow>=12.3,<13",
    "firebase-admin>=6.5,<7",
    "django-redis>=6,<7",
    "reportlab>=4.4,<5",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-django>=4.11,<5",
    "pytest-cov>=7,<8",
]

[tool.setuptools.packages.find]
include = ["apps*", "common*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["apps", "config", "common"]
omit = ["*/migrations/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
